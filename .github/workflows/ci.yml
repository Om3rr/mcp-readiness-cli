name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Package is publish-ready (dry run only; do not publish)
        if: matrix.node == 22
        run: npm pack --dry-run
      - name: Scan the bundled stdio demo
        if: matrix.node == 22
        run: node bin/mcp-readiness.js --stdio node examples/demo-stdio.mjs --fail-under 80
